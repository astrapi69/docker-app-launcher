check_bind_address_open_fix: 'If you did not intend this: set "bind_address" to "127.0.0.1" in the launcher config and restart the app. In compose mode the app''s own compose file publishes the port - change the ports line there to "127.0.0.1:PORT:...". If you DID intend network access, nothing is broken; keep it only on networks you trust.'
check_bind_address_open_meaning: The app is reachable from every network this computer is on, not just from this computer. It has no password protection, so anyone who can reach it can read and change your data and use your provider keys.
check_compose_file_exists_fix: Make sure the app files are present under install_dir and the compose file name in the config matches the real file.
check_compose_file_exists_meaning: This app is driven by a Docker Compose file, and the configured file does not exist at the shown path.
check_docker_running_fix: 'Start Docker Desktop or the docker service (Linux: ''sudo systemctl start docker''), then run the system check again. If Docker is not installed, install it first.'
check_docker_running_meaning: Docker is the runtime that hosts the app. It is installed but not running, or not installed at all - nothing can start without it.
check_dockerfile_exists_fix: Point install_dir (and build_context) at the app's source checkout that contains the Dockerfile.
check_dockerfile_exists_meaning: This mode builds the app from a Dockerfile, and none was found at the shown path.
check_health_reachable_fix: Open the app logs (App logs button) to see the app's own error message, then stop and start the app again.
check_health_reachable_meaning: The app's container is running, but the app inside does not answer its health check - the app itself may have crashed.
check_image_source_declared_fix: Set image_reference (and optionally image_archive) in the launcher config, then run the system check again.
check_image_source_declared_meaning: Image mode needs to know which app image to run - neither an image reference nor a usable archive is configured.
check_install_dir_fix: Set install_dir in the launcher config to the folder that holds the app's files, then run the system check again.
check_install_dir_meaning: The launcher could not find the app's source folder (install_dir) that this deployment mode needs.
check_port_drift_fix: Align env_port_key and the .env file with the compose file's port variable, or reinstall the app so the ports match.
check_port_drift_meaning: The running container publishes a different port than the launcher expects, so buttons and browser links would open the wrong address.
check_readiness_blocker_fix: Follow the instruction in the message - every blocker names its own repair - then run the system check again.
check_readiness_blocker_meaning: A precondition for installing or starting the app is missing; the message names the exact gap.
