name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install GObject system libraries (for the PyGObject tray extra)
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config

      - name: Install xvfb + scrot (GUI tests + screenshots) and Qt runtime libs
        run: sudo apt-get install -y xvfb scrot libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Check formatting with ruff
        run: poetry run ruff format --check src/ tests/

      - name: Type check with mypy
        run: poetry run mypy src/ tests/

      - name: Run tests with coverage (GUI tests under xvfb)
        run: xvfb-run -a poetry run pytest --cov=docker_app_launcher --cov-report=xml
        env:
          DAL_SCREENSHOTS: "1"

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: gui-screenshots
          path: test-screenshots/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frozen-binary:
    # A bug that only exists in the frozen PyInstaller artifact (missing i18n
    # catalogs #34, placeholder branding, wrong version) is invisible to every
    # source-tree test by nature. This job builds the REAL binary from the
    # rendered spec, opens its REAL window under xvfb, and asserts the
    # rendered contract via --render-probe (#38). Mandatory gate.
    name: Frozen binary contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package + PyInstaller
        run: pip install . pyinstaller

      - name: Build the frozen binary and probe its rendered window
        run: |
          xvfb-run -a bash tests/frozen/build_and_probe.sh /tmp/frozen-ci > /tmp/probe.json
          VERSION=$(python -c "import docker_app_launcher; print(docker_app_launcher.__version__)")
          python tests/frozen/assert_render_probe.py \
            --expect-version "$VERSION" \
            --expect-app-name "Frozen Probe App" < /tmp/probe.json
