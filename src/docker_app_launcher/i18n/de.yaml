data_preserved: Deine Daten wurden beibehalten.
disk_low: 'Wenig Speicherplatz für den Build: nur {free} frei auf {path}, unter den {needed}, die ein Build voraussichtlich braucht. Speicher freigeben oder min_build_disk_bytes auf 0 setzen, um diese Prüfung zu überspringen.'
docker_desktop_waiting: Docker Desktop startet - das kann einen Moment dauern (VM-Boot)…
docker_group_added: Gruppe 'docker' hinzugefügt. Melde dich jetzt ab und wieder an (oder starte neu), damit die Änderung wirksam wird - in dieser Sitzung ist Docker noch nicht nutzbar.
docker_group_cancelled: 'Abgebrochen - nichts geändert. Manuell: ''sudo usermod -aG docker $USER'' ausführen, danach ab- und wieder anmelden.'
docker_group_confirm: Dein Konto wird der Gruppe 'docker' hinzugefügt. Das gibt praktisch Root-Rechte auf diesem System (bei Docker üblich). Fortfahren?
docker_group_failed: 'Konnte dich nicht zur Gruppe ''docker'' hinzufügen: {error}. Manuell: ''sudo usermod -aG docker $USER'' ausführen, danach ab- und wieder anmelden.'
docker_no_path: Docker Desktop ist installiert, aber nicht im PATH.
docker_no_permission: 'Docker läuft, aber dein Benutzer hat keine Berechtigung (nicht in der Gruppe ''docker''). Führe ''sudo usermod -aG docker $USER'' aus UND melde dich danach ab und wieder an (oder starte neu) - die Gruppenänderung wird erst in einer neuen Anmeldesitzung aktiv. Nur fürs aktuelle Terminal: ''newgrp docker''.'
docker_no_response: Docker antwortet nicht.
docker_not_installed: Docker ist nicht installiert (docker nicht im PATH).
docker_not_running: Docker ist installiert, aber nicht gestartet.
docker_not_running_detail: 'Docker läuft nicht. Geprüfter Kontext ''{context}'' ({endpoint}): {error}'
docker_ok: Docker läuft ✓
docker_permission_non_root_socket: Docker hat die Verbindung an diesem Endpunkt abgelehnt. Das ist nicht der klassische Root-Socket, daher gilt die 'docker'-Gruppe hier nicht. Für rootless Docker DOCKER_HOST auf $XDG_RUNTIME_DIR/docker.sock setzen; bei einem entfernten Endpunkt dessen Zugriffsregeln prüfen; bei Docker Desktop sicherstellen, dass es läuft.
docker_running: Docker läuft.
docker_running_other_context: Docker läuft über Kontext '{context}' - der aktive Kontext war nicht erreichbar, der Launcher hat sich automatisch verbunden.
docker_stopped: Docker Desktop ist nicht gestartet.
docker_unavailable: Docker ist nicht verfügbar (nicht gestartet).
dockerfile_base_unresolved: Dockerfile nicht gefunden unter {path}. install_dir ist nicht gesetzt, daher wurde relativ zum aktuellen Verzeichnis gesucht, was unzuverlässig ist, wenn der Launcher aus einer Menüverknüpfung, einem Snap oder einem Dateimanager gestartet wird. Setze install_dir in der Launcher-Konfiguration auf das Build-Verzeichnis.
dockerfile_mode_needs_dockerpy: Der dockerfile-Modus benötigt das Python-Paket docker (docker-py), das in dieser Installation nicht importierbar ist.
