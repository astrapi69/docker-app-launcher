closed_minimized: Aplikasi tetap berjalan; jendela diminimalkan.
compose_base_unresolved: Berkas compose tidak ditemukan di {path}. install_dir tidak diatur, jadi dicari relatif terhadap direktori saat ini, yang tidak dapat diandalkan saat launcher dijalankan dari pintasan menu, Snap, atau pengelola berkas. Atur install_dir di konfigurasi launcher ke direktori yang berisi berkas compose.
compose_missing: 'Docker Compose tidak tersedia. Pasang plugin Compose v2 — Ubuntu/Debian: ''sudo apt install docker-compose-plugin'' (atau perbarui Docker) — lalu mulai ulang launcher. Aplikasi single-service dapat memakai deployment_mode ''dockerfile'' sebagai alternatif (tanpa Compose).'
compose_not_found: 'Berkas compose tidak ditemukan: {path}'
compose_unreadable: 'Berkas compose ditemukan tetapi tidak terbaca: {path} ({error}).'
compose_v1_incompatible: 'Hanya docker-compose v1 lama yang ditemukan dan tidak bisa membaca berkas compose aplikasi ini ({path}). Pasang plugin Compose v2: ''sudo apt install docker-compose-plugin'', lalu mulai ulang launcher.'
