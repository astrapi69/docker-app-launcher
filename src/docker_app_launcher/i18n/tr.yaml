check_bind_address_open_fix: 'Bunu istemediysen: başlatıcı yapılandırmasında "bind_address" değerini "127.0.0.1" yap ve uygulamayı yeniden başlat. Compose modunda portu uygulamanın kendi compose dosyası yayımlar - oradaki ports satırını "127.0.0.1:PORT:..." olarak değiştir. Ağ erişimini bilerek istediysen bir sorun yok; yalnızca güvendiğin ağlarda kullan.'
check_bind_address_open_meaning: Uygulama, yalnızca bu bilgisayardan değil, bu bilgisayarın bağlı olduğu her ağdan erişilebilir durumda. Parola koruması yok; ona erişebilen herkes verilerini okuyup değiştirebilir ve sağlayıcı anahtarlarını kullanabilir.
check_compose_file_exists_fix: Uygulama dosyalarının install_dir altında olduğundan ve compose dosya adının gerçek dosyayla eşleştiğinden emin olun.
check_compose_file_exists_meaning: Bu uygulama bir Docker Compose dosyasıyla yönetiliyor ve yapılandırılan dosya gösterilen yolda yok.
check_docker_running_fix: 'Docker Desktop''ı veya docker hizmetini başlatın (Linux: ''sudo systemctl start docker''), sonra sistem denetimini yeniden çalıştırın. Docker kurulu değilse önce kurun.'
check_docker_running_meaning: Docker, uygulamanın çalıştığı ortamdır. Kurulu ama çalışmıyor ya da hiç kurulu değil. Docker olmadan hiçbir şey başlatılamaz.
check_dockerfile_exists_fix: install_dir (ve build_context) değerini Dockerfile içeren uygulama kaynağına yönlendirin.
check_dockerfile_exists_meaning: Bu mod uygulamayı bir Dockerfile'dan derler ve gösterilen yolda hiçbiri bulunamadı.
check_health_reachable_fix: Uygulamanın kendi hatasını görmek için uygulama günlüklerini açın (App logs düğmesi), sonra uygulamayı durdurup yeniden başlatın.
check_health_reachable_meaning: Uygulamanın kapsayıcısı çalışıyor ama içindeki uygulama sağlık denetimine yanıt vermiyor - uygulamanın kendisi çökmüş olabilir.
check_image_source_declared_fix: Yapılandırmada image_reference (isteğe bağlı olarak image_archive) ayarlayın ve yeniden denetleyin.
check_image_source_declared_meaning: Image modu hangi uygulama imajının çalıştırılacağını bilmelidir - ne bir imaj referansı ne de kullanılabilir bir arşiv yapılandırılmış.
check_install_dir_fix: Launcher yapılandırmasında install_dir değerini uygulama dosyalarının bulunduğu klasöre ayarlayın ve yeniden denetleyin.
check_install_dir_meaning: Launcher, bu modun gerektirdiği uygulama kaynak klasörünü (install_dir) bulamıyor.
check_port_drift_fix: env_port_key ve .env dosyasını compose dosyasının port değişkeniyle hizalayın veya portların eşleşmesi için uygulamayı yeniden kurun.
check_port_drift_meaning: Çalışan kapsayıcı, launcher'ın beklediğinden farklı bir port yayımlıyor - düğmeler ve tarayıcı bağlantıları yanlış adresi açar.
check_readiness_blocker_fix: Mesajdaki talimatı izleyin - her engel kendi onarımını adlandırır - sonra yeniden denetleyin.
check_readiness_blocker_meaning: Kurulum veya başlatma için bir önkoşul eksik; mesaj eksikliği tam olarak adlandırıyor.
