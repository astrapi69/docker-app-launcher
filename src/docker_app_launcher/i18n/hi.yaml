docker_permission_non_root_socket: Docker ने इस एंडपॉइंट पर कनेक्शन अस्वीकार किया। यह क्लासिक root सॉकेट नहीं है, इसलिए 'docker' समूह यहाँ लागू नहीं होता। rootless Docker के लिए DOCKER_HOST को $XDG_RUNTIME_DIR/docker.sock पर सेट करें; रिमोट एंडपॉइंट के लिए उसके एक्सेस नियम जाँचें; Docker Desktop के लिए सुनिश्चित करें कि वह चल रहा है।
