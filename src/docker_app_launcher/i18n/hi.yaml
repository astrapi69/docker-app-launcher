check_bind_address_open_fix: 'अगर यह जानबूझकर नहीं था: लॉन्चर कॉन्फ़िगरेशन में "bind_address" को "127.0.0.1" करें और ऐप फिर से शुरू करें। compose मोड में पोर्ट ऐप की अपनी compose फ़ाइल प्रकाशित करती है - वहाँ ports पंक्ति को "127.0.0.1:PORT:..." करें। अगर नेटवर्क पहुँच जानबूझकर है, तो कुछ टूटा नहीं है; केवल भरोसेमंद नेटवर्क पर इस्तेमाल करें।'
check_bind_address_open_meaning: ऐप इस कंप्यूटर के हर नेटवर्क से पहुँचा जा सकता है, केवल इसी कंप्यूटर से नहीं। इसमें पासवर्ड सुरक्षा नहीं है, इसलिए जो भी इस तक पहुँच सके वह आपका डेटा पढ़ और बदल सकता है और आपकी प्रदाता कुंजियाँ इस्तेमाल कर सकता है।
check_compose_file_exists_fix: सुनिश्चित करें कि ऐप की फ़ाइलें install_dir में हैं और compose फ़ाइल का नाम असली फ़ाइल से मेल खाता है।
check_compose_file_exists_meaning: यह ऐप एक Docker Compose फ़ाइल से चलती है, और कॉन्फ़िगर की गई फ़ाइल दिखाए गए पथ पर मौजूद नहीं है।
check_docker_running_fix: 'Docker Desktop या docker सेवा शुरू करें (Linux: ''sudo systemctl start docker''), फिर सिस्टम जाँच दोबारा चलाएँ। अगर Docker इंस्टॉल नहीं है, तो पहले उसे इंस्टॉल करें।'
check_docker_running_meaning: Docker वह रनटाइम है जिसमें ऐप चलती है। यह इंस्टॉल है पर चालू नहीं, या बिल्कुल इंस्टॉल नहीं है। Docker के बिना कुछ भी शुरू नहीं हो सकता।
check_dockerfile_exists_fix: install_dir (और build_context) को ऐप के उस सोर्स चेकआउट पर सेट करें जिसमें Dockerfile है।
check_dockerfile_exists_meaning: यह मोड ऐप को एक Dockerfile से बनाता है, और दिखाए गए पथ पर कोई नहीं मिला।
check_health_reachable_fix: ऐप की अपनी त्रुटि देखने के लिए ऐप लॉग खोलें (App logs बटन), फिर ऐप को रोककर दोबारा शुरू करें।
check_health_reachable_meaning: ऐप का कंटेनर चल रहा है, पर अंदर की ऐप अपनी स्वास्थ्य जाँच का जवाब नहीं दे रही - शायद ऐप क्रैश हो गई है।
check_image_source_declared_fix: कॉन्फ़िगरेशन में image_reference (और वैकल्पिक रूप से image_archive) सेट करें और दोबारा जाँचें।
check_image_source_declared_meaning: Image मोड को जानना चाहिए कि कौन-सी ऐप इमेज चलानी है - न कोई इमेज संदर्भ और न कोई उपयोगी आर्काइव कॉन्फ़िगर है।
check_install_dir_fix: लॉन्चर कॉन्फ़िगरेशन में install_dir को ऐप की फ़ाइलों वाले फ़ोल्डर पर सेट करें और दोबारा जाँचें।
check_install_dir_meaning: लॉन्चर को ऐप का स्रोत फ़ोल्डर (install_dir) नहीं मिला, जो इस मोड को चाहिए।
check_port_drift_fix: env_port_key और .env फ़ाइल को compose फ़ाइल के पोर्ट वेरिएबल से मिलाएँ, या ऐप दोबारा इंस्टॉल करें ताकि पोर्ट मेल खाएँ।
check_port_drift_meaning: चल रहा कंटेनर उस पोर्ट से अलग पोर्ट प्रकाशित करता है जिसकी लॉन्चर अपेक्षा करता है - बटन और ब्राउज़र लिंक गलत पते खोलेंगे।
check_readiness_blocker_fix: संदेश में दिए निर्देश का पालन करें - हर ब्लॉकर अपनी मरम्मत खुद बताता है - फिर दोबारा जाँचें।
check_readiness_blocker_meaning: इंस्टॉल या शुरू करने की एक शर्त पूरी नहीं है; संदेश सटीक कमी बताता है।
