disk_low: 'Ruang disk untuk build sedikit: hanya {free} bebas di {path}, di bawah {needed} yang kemungkinan dibutuhkan sebuah build. Kosongkan ruang, atau setel min_build_disk_bytes ke 0 untuk melewati pemeriksaan ini.'
docker_desktop_waiting: Docker Desktop sedang dimulai - ini bisa memakan waktu sejenak (boot VM)…
docker_group_added: Grup 'docker' ditambahkan. Keluar lalu masuk lagi (atau mulai ulang) agar perubahan berlaku - Docker belum dapat digunakan di sesi ini.
docker_group_cancelled: 'Dibatalkan - tidak ada perubahan. Manual: jalankan ''sudo usermod -aG docker $USER'', lalu keluar dan masuk lagi.'
docker_group_confirm: Akun Anda akan ditambahkan ke grup 'docker'. Ini praktis memberikan hak root pada sistem ini (praktik standar Docker). Lanjutkan?
docker_group_failed: 'Gagal menambahkan ke grup ''docker'': {error}. Manual: jalankan ''sudo usermod -aG docker $USER'', lalu keluar dan masuk lagi.'
docker_no_path: Docker Desktop terpasang tetapi tidak ada di PATH.
docker_no_permission: 'Docker sedang berjalan, tetapi pengguna Anda tidak punya izin (bukan anggota grup ''docker''). Jalankan ''sudo usermod -aG docker $USER'' DAN setelah itu keluar lalu masuk lagi (atau mulai ulang) - perubahan grup hanya aktif di sesi login baru. Hanya untuk terminal saat ini: ''newgrp docker''.'
docker_no_response: Docker tidak merespons.
docker_not_installed: Docker belum terpasang (docker tidak ada di PATH).
docker_not_running: Docker terpasang tetapi belum dijalankan.
docker_not_running_detail: 'Docker tidak berjalan. Context yang diperiksa ''{context}'' ({endpoint}): {error}'
docker_ok: Docker berjalan ✓
docker_permission_non_root_socket: Docker menolak koneksi di endpoint ini, yang bukan socket root klasik, sehingga grup 'docker' tidak berlaku di sini. Untuk Docker rootless, atur DOCKER_HOST ke $XDG_RUNTIME_DIR/docker.sock; untuk endpoint jarak jauh periksa aturan aksesnya; untuk Docker Desktop pastikan sedang berjalan.
docker_running: Docker berjalan.
