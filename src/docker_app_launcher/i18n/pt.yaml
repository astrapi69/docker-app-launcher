compose_missing: 'O Docker Compose não está disponível. Instale o plugin Compose v2 — Ubuntu/Debian: ''sudo apt install docker-compose-plugin'' (ou atualize o Docker) — e reinicie o launcher. Apps de serviço único podem alternativamente usar deployment_mode ''dockerfile'' (sem Compose).'
