name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  publish:
    name: Gate, build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Require green CI on the tagged commit (#93)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checked set must be COMPLETE: publish runs make ci itself, but
          # the old-engine cell, the frozen-binary contract, the 3.10-3.14
          # matrix and the cross-platform smokes live only in ci.yml. A red or
          # cancelled regular check of the published commit blocks the upload.
          # (On a legitimate flake: fix or rerun ci.yml until green, then rerun
          # this workflow - the tag stays in place.)
          for i in $(seq 1 80); do
            STATE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA"               --json status,conclusion --jq 'if length == 0 then "none" elif .[0].status != "completed" then "pending" else .[0].conclusion end')
            case "$STATE" in
              success) echo "ci.yml green on $GITHUB_SHA"; exit 0 ;;
              pending|none) echo "waiting for ci.yml on $GITHUB_SHA ($STATE)"; sleep 30 ;;
              *) echo "::error::ci.yml on $GITHUB_SHA concluded '$STATE' - publishing is blocked until the commit's regular checks are green."; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for ci.yml on $GITHUB_SHA."; exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(poetry version -s)"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION. Bump the version before tagging."
            exit 1
          fi

      - name: Verify CHANGELOG has a section for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' section. Write the changelog before tagging."
            exit 1
          fi

      - name: Install system libraries (PyGObject tray extra, Qt runtime, xvfb)
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config libegl1 libgl1 libxkbcommon-x11-0 xvfb

      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Run full check chain (lint + format + types + tests)
        run: xvfb-run -a make ci

      - name: Build distributions
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # Idempotent: a tag whose version was already uploaded (e.g. via the
          # local `make publish` path) does not fail the workflow.
          skip-existing: true
