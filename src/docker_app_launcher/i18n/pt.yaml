building: Construindo imagem (pode levar alguns minutos na primeira vez)...
buildx_missing: 'A construção do Docker Compose delega ao buildx e precisa de buildx {required} ou mais recente, mas nenhum plugin buildx foi encontrado. Instale o buildx: baixe o binário para a sua plataforma nas releases do docker/buildx, coloque-o em {path} e torne-o executável com ''chmod +x {path}''. Pacotes de distribuição têm se mostrado pouco confiáveis para isso.'
buildx_too_old: 'A construção do Docker Compose delega ao buildx e precisa de buildx {required} ou mais recente, mas está instalado buildx {found}. Instale um buildx mais recente: baixe o binário para a sua plataforma nas releases do docker/buildx, coloque-o em {path} e torne-o executável com ''chmod +x {path}''. Pacotes de distribuição têm se mostrado pouco confiáveis para isso.'
cancel_operation: Cancelar
cancel_unresponsive: A etapa em execução não responde ao pedido de cancelamento. Ela pode terminar em segundo plano - a janela volta a ser utilizável e o estado será atualizado assim que terminar.
cancelling: Cancelando...
check_compose_file_exists_fix: Garanta que os arquivos do aplicativo estejam em install_dir e que o nome do arquivo compose corresponda ao arquivo real.
check_compose_file_exists_meaning: Este aplicativo é controlado por um arquivo Docker Compose, e o arquivo configurado não existe no caminho mostrado.
check_docker_running_fix: 'Inicie o Docker Desktop ou o serviço docker (Linux: ''sudo systemctl start docker'') e execute a verificação novamente. Se o Docker não estiver instalado, instale-o primeiro.'
check_docker_running_meaning: O Docker é o ambiente onde o aplicativo roda. Está instalado mas parado, ou não está instalado. Sem o Docker nada pode iniciar.
check_dockerfile_exists_fix: Aponte install_dir (e build_context) para o código-fonte do aplicativo que contém o Dockerfile.
check_dockerfile_exists_meaning: Este modo constrói o aplicativo a partir de um Dockerfile, e nenhum foi encontrado no caminho mostrado.
check_health_reachable_fix: Abra os logs do aplicativo (botão App logs) para ver o erro do próprio aplicativo, depois pare e inicie o aplicativo novamente.
check_health_reachable_meaning: 'O contêiner está rodando, mas o aplicativo não responde à verificação de saúde: ele pode ter travado.'
check_image_source_declared_fix: Defina image_reference (e opcionalmente image_archive) na configuração e verifique novamente.
check_image_source_declared_meaning: 'O modo image precisa saber qual imagem executar: nem uma referência de imagem nem um arquivo utilizável está configurado.'
check_install_dir_fix: Defina install_dir na configuração do launcher para a pasta com os arquivos do aplicativo e verifique novamente.
check_install_dir_meaning: O launcher não encontra a pasta de origem do aplicativo (install_dir) exigida por este modo.
check_port_drift_fix: Alinhe env_port_key e o arquivo .env com a variável de porta do arquivo compose, ou reinstale o aplicativo para que as portas coincidam.
check_port_drift_meaning: 'O contêiner em execução publica uma porta diferente da esperada pelo launcher: botões e links abririam o endereço errado.'
check_readiness_blocker_fix: Siga a instrução da mensagem - cada bloqueio nomeia seu próprio reparo - e verifique novamente.
check_readiness_blocker_meaning: Falta um pré-requisito para instalar ou iniciar o aplicativo; a mensagem nomeia a lacuna exata.
