internal_port_cancelled_stopped: 'Abgebrochen - die App ist jetzt GESTOPPT, weil eine Änderung des internen Ports sie vor dem Neubau stoppt. Der neue interne Port ist bereits gespeichert; ein Druck auf Start baut damit neu, der Build-Cache bleibt und beschleunigt das. ({detail})'
