building: Image bauen (kann beim ersten Mal einige Minuten dauern)...
buildx_missing: 'Der Docker-Compose-Build delegiert an buildx und benötigt buildx {required} oder neuer, es wurde aber kein buildx-Plugin gefunden. buildx installieren: die Binärdatei für deine Plattform aus den docker/buildx-Releases herunterladen, unter {path} ablegen und mit ''chmod +x {path}'' ausführbar machen. Paketquellen haben sich hierfür als unzuverlässig erwiesen.'
buildx_too_old: 'Der Docker-Compose-Build delegiert an buildx und benötigt buildx {required} oder neuer, installiert ist aber buildx {found}. Neueres buildx installieren: die Binärdatei für deine Plattform aus den docker/buildx-Releases herunterladen, unter {path} ablegen und mit ''chmod +x {path}'' ausführbar machen. Paketquellen haben sich hierfür als unzuverlässig erwiesen.'
cancel_operation: Abbrechen
cancel_unresponsive: Der laufende Schritt reagiert nicht auf die Abbruchbitte. Er läuft möglicherweise im Hintergrund zu Ende - das Fenster ist wieder bedienbar, und die Zustandsanzeige aktualisiert sich, sobald er endet.
cancelling: Wird abgebrochen...
check_bind_address_open_fix: 'Falls das nicht beabsichtigt war: "bind_address" in der Launcher-Konfiguration auf "127.0.0.1" setzen und die App neu starten. Im Compose-Modus veröffentlicht die Compose-Datei der App den Port - dort die ports-Zeile auf "127.0.0.1:PORT:..." ändern. Falls der Netzzugriff gewollt ist, ist nichts kaputt; nutze ihn nur in Netzen, denen du vertraust.'
check_bind_address_open_meaning: Die App ist aus jedem Netzwerk erreichbar, in dem dieser Rechner ist, nicht nur von diesem Rechner. Sie hat keinen Passwortschutz, also kann jeder, der sie erreicht, deine Daten lesen und ändern und deine Anbieterschlüssel nutzen.
check_compose_file_exists_fix: Stelle sicher, dass die App-Dateien unter install_dir liegen und der Compose-Dateiname in der Konfiguration mit der echten Datei übereinstimmt.
check_compose_file_exists_meaning: Diese App wird über eine Docker-Compose-Datei gesteuert, und die konfigurierte Datei existiert am angezeigten Pfad nicht.
check_docker_running_fix: 'Starte Docker Desktop oder den docker-Dienst (Linux: ''sudo systemctl start docker'') und führe die Systemprüfung erneut aus. Falls Docker fehlt, installiere es zuerst.'
check_docker_running_meaning: Docker ist die Laufzeitumgebung, in der die App läuft. Es ist installiert, aber nicht gestartet - oder gar nicht installiert. Ohne Docker kann nichts starten.
check_dockerfile_exists_fix: Richte install_dir (und build_context) auf den Quell-Checkout der App mit dem Dockerfile.
check_dockerfile_exists_meaning: Dieser Modus baut die App aus einem Dockerfile, und am angezeigten Pfad wurde keines gefunden.
check_health_reachable_fix: Öffne die App-Logs (Button App-Logs), um die Fehlermeldung der App zu sehen, und stoppe und starte die App danach neu.
check_health_reachable_meaning: Der Container der App läuft, aber die App darin antwortet nicht auf ihre Gesundheitsprüfung - möglicherweise ist die App selbst abgestürzt.
check_image_source_declared_fix: Setze image_reference (und optional image_archive) in der Launcher-Konfiguration und prüfe erneut.
check_image_source_declared_meaning: Der Image-Modus muss wissen, welches App-Image laufen soll - es ist weder eine Image-Referenz noch ein nutzbares Archiv konfiguriert.
check_install_dir_fix: Setze install_dir in der Launcher-Konfiguration auf den Ordner mit den App-Dateien und prüfe erneut.
check_install_dir_meaning: Der Launcher findet den Quellordner der App (install_dir) nicht, den dieser Modus benötigt.
check_port_drift_fix: Bringe env_port_key und die .env-Datei mit der Port-Variable der Compose-Datei in Einklang oder installiere die App neu, damit die Ports übereinstimmen.
check_port_drift_meaning: Der laufende Container veröffentlicht einen anderen Port als der Launcher erwartet - Buttons und Browser-Links würden die falsche Adresse öffnen.
check_readiness_blocker_fix: Folge der Anweisung in der Meldung - jeder Blocker benennt seine eigene Reparatur - und prüfe erneut.
check_readiness_blocker_meaning: Eine Voraussetzung zum Installieren oder Starten fehlt; die Meldung benennt die genaue Lücke.
checking_context: Prüfe Docker-Context '{context}' ({endpoint})…
checking_docker: Docker prüfen...
checking_health: Bereitschaft prüfen...
