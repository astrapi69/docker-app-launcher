docker_group_confirm: Ο λογαριασμός σου θα προστεθεί στην ομάδα 'docker'. Αυτό δίνει πρακτικά δικαιώματα root σε αυτό το σύστημα (συνηθισμένη πρακτική με το Docker). Συνέχεια;
