compose_base_unresolved: Compose-Datei nicht gefunden unter {path}. install_dir ist nicht gesetzt, daher wurde relativ zum aktuellen Verzeichnis gesucht, was unzuverlässig ist, wenn der Launcher aus einer Menüverknüpfung, einem Snap oder einem Dateimanager gestartet wird. Setze install_dir in der Launcher-Konfiguration auf das Verzeichnis mit der Compose-Datei.
compose_missing: 'Docker Compose ist nicht verfügbar. Compose-v2-Plugin installieren — Ubuntu/Debian: ''sudo apt install docker-compose-plugin'' (oder Docker aktualisieren) — danach den Launcher neu starten. Single-Service-Apps können alternativ deployment_mode ''dockerfile'' nutzen (kein Compose nötig).'
compose_not_found: 'Compose-Datei nicht gefunden: {path}'
compose_unreadable: 'Compose-Datei gefunden, aber nicht lesbar: {path} ({error}).'
compose_v1_incompatible: 'Nur das alte docker-compose v1 wurde gefunden und es kann die Compose-Datei dieser App ({path}) nicht lesen. Compose-v2-Plugin installieren: ''sudo apt install docker-compose-plugin'', danach den Launcher neu starten.'
confirm_uninstall: 'Möchtest du {app} deinstallieren?

  Deine Daten bleiben erhalten.'
container_not_running: Container wurde gebaut, läuft aber nicht.
container_started: Container gestartet ✓
copied_to_clipboard: In die Zwischenablage kopiert.
