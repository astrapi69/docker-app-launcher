compose_v1_incompatible: 'Apenas o antigo docker-compose v1 foi encontrado e ele não consegue ler o arquivo compose deste app ({path}). Instale o plugin Compose v2: ''sudo apt install docker-compose-plugin'' e reinicie o launcher.'
confirm_uninstall: 'Deseja desinstalar {app}?

  Seus dados são preservados.'
