docker_no_permission: 'Το Docker εκτελείται, αλλά ο χρήστης σου δεν έχει δικαίωμα (δεν ανήκει στην ομάδα ''docker''). Εκτέλεσε ''sudo usermod -aG docker $USER'' ΚΑΙ μετά αποσυνδέσου και συνδέσου ξανά (ή κάνε επανεκκίνηση) - η αλλαγή ομάδας ενεργοποιείται μόνο σε νέα συνεδρία. Μόνο για το τρέχον τερματικό: ''newgrp docker''.'
