disk_low: 'Pouco espaço em disco para o build: apenas {free} livres em {path}, abaixo dos {needed} que um build provavelmente vai precisar. Libere espaço, ou defina min_build_disk_bytes como 0 para pular esta verificação.'
docker_desktop_waiting: O Docker Desktop está iniciando - isso pode levar um momento (boot da VM)…
docker_group_added: Grupo 'docker' adicionado. Saia e entre novamente (ou reinicie) para a mudança valer - o Docker ainda não está utilizável nesta sessão.
docker_group_cancelled: 'Cancelado - nada foi alterado. Manual: execute ''sudo usermod -aG docker $USER'' e depois saia e entre novamente.'
docker_group_confirm: Sua conta será adicionada ao grupo 'docker'. Na prática isso concede privilégios de root neste sistema (prática padrão com Docker). Continuar?
docker_group_failed: 'Não foi possível adicionar ao grupo ''docker'': {error}. Manual: execute ''sudo usermod -aG docker $USER'' e depois saia e entre novamente.'
docker_no_path: O Docker Desktop está instalado mas não está no PATH.
docker_no_permission: 'O Docker está em execução, mas o seu usuário não tem permissão (fora do grupo ''docker''). Execute ''sudo usermod -aG docker $USER'' E depois saia e entre novamente (ou reinicie) - a mudança de grupo só vale numa nova sessão de login. Apenas para o terminal atual: ''newgrp docker''.'
docker_no_response: O Docker não está respondendo.
docker_not_installed: O Docker não está instalado (docker não está no PATH).
docker_not_running: O Docker está instalado mas não iniciado.
docker_not_running_detail: 'O Docker não está em execução. Contexto verificado ''{context}'' ({endpoint}): {error}'
docker_ok: O Docker está em execução ✓
docker_permission_non_root_socket: O Docker recusou a conexão neste endpoint, que não é o socket root clássico, então o grupo 'docker' não se aplica aqui. Para Docker rootless, defina DOCKER_HOST como $XDG_RUNTIME_DIR/docker.sock; para um endpoint remoto, verifique suas regras de acesso; para Docker Desktop, confirme que está em execução.
