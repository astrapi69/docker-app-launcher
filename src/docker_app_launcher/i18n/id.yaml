dockerfile_base_unresolved: Dockerfile tidak ditemukan di {path}. install_dir tidak diatur, jadi dicari relatif terhadap direktori saat ini, yang tidak dapat diandalkan saat launcher dijalankan dari pintasan menu, Snap, atau pengelola berkas. Atur install_dir di konfigurasi launcher ke direktori build.
