about: À propos…
about_open_issues: Signaler un problème - ouvrir l'issue tracker dans le navigateur ?
advanced_settings: Paramètres avancés (experts)
advanced_warning: Ne les modifiez que si vous savez ce que vous faites. Une modification nécessite une reconstruction (2-5 minutes).
already_installed: '{app} est déjà installé et en cours d''exécution.'
already_running: '{app} est déjà en cours d''exécution.'
already_stopped: '{app} était déjà arrêté.'
app_logs: Journaux de l'app
app_logs_empty: L'app n'a encore produit aucun journal.
app_logs_failed: 'Impossible de récupérer les journaux : {detail}'
app_logs_follow_stop: Arrêter les journaux
app_requirement_missing: Cette app nécessite {component} {required} ou plus récent, mais {component} n'a pas pu être détecté. Installez ou mettez Docker à jour.
app_requirement_too_old: Cette app nécessite {component} {required} ou plus récent, mais {found} est installé. Mettez Docker à jour en conséquence.
apply: Appliquer
apply_port: Appliquer le port
background_iconified: S'exécute en arrière-plan. Restaurez la fenêtre depuis la barre des tâches.
background_tray: S'exécute dans la zone de notification. Double-cliquez sur l'icône pour restaurer.
build_cancelled: La construction a été annulée.
build_context_not_found: 'Répertoire de contexte de build introuvable : {path}. Vérifiez build_context dans la configuration du launcher.'
build_failed: 'La construction Docker a échoué :

  {detail}'
build_failed_network: 'Le build n''a pas pu atteindre le réseau pour télécharger les images : {detail}. Vérifiez votre connexion internet ou votre proxy, puis réessayez.'
build_timeout: La construction Docker a dépassé le délai imparti.
building: Construction de l'image (peut prendre quelques minutes la première fois)...
buildx_missing: 'Le build Docker Compose délègue à buildx et nécessite buildx {required} ou plus récent, mais aucun plugin buildx n''a été trouvé. Installez buildx : téléchargez le binaire pour votre plateforme depuis les releases docker/buildx, placez-le dans {path}, puis rendez-le exécutable avec ''chmod +x {path}''. Les paquets de distribution se sont révélés peu fiables pour cela.'
buildx_too_old: 'Le build Docker Compose délègue à buildx et nécessite buildx {required} ou plus récent, mais buildx {found} est installé. Installez un buildx plus récent : téléchargez le binaire pour votre plateforme depuis les releases docker/buildx, placez-le dans {path}, puis rendez-le exécutable avec ''chmod +x {path}''. Les paquets de distribution se sont révélés peu fiables pour cela.'
cancel_operation: Annuler
cancel_unresponsive: L'étape en cours ne répond pas à la demande d'annulation. Elle peut se terminer en arrière-plan - la fenêtre est de nouveau utilisable et l'état se mettra à jour dès qu'elle se termine.
cancelling: Annulation...
check_compose_file_exists_fix: Vérifiez que les fichiers de l'application sont présents sous install_dir et que le nom du fichier compose correspond au fichier réel.
check_compose_file_exists_meaning: Cette application est pilotée par un fichier Docker Compose, et le fichier configuré n'existe pas au chemin affiché.
check_docker_running_fix: 'Démarrez Docker Desktop ou le service docker (Linux : ''sudo systemctl start docker''), puis relancez la vérification. Si Docker n''est pas installé, installez-le d''abord.'
check_docker_running_meaning: Docker est l'environnement d'exécution de l'application. Il est installé mais arrêté, ou pas installé du tout. Sans Docker, rien ne peut démarrer.
check_dockerfile_exists_fix: Faites pointer install_dir (et build_context) vers les sources de l'application contenant le Dockerfile.
check_dockerfile_exists_meaning: Ce mode construit l'application à partir d'un Dockerfile, et aucun n'a été trouvé au chemin affiché.
check_health_reachable_fix: Ouvrez les journaux de l'application (bouton App logs) pour voir son erreur, puis arrêtez et redémarrez l'application.
check_health_reachable_meaning: 'Le conteneur tourne, mais l''application ne répond pas à son contrôle de santé : elle a peut-être planté.'
check_image_source_declared_fix: Définissez image_reference (et éventuellement image_archive) dans la configuration, puis vérifiez à nouveau.
check_image_source_declared_meaning: 'Le mode image doit savoir quelle image exécuter : ni référence d''image ni archive utilisable n''est configurée.'
check_install_dir_fix: Définissez install_dir dans la configuration du launcher sur le dossier contenant les fichiers de l'application, puis vérifiez à nouveau.
check_install_dir_meaning: Le launcher ne trouve pas le dossier source de l'application (install_dir) requis par ce mode.
check_port_drift_fix: Alignez env_port_key et le fichier .env sur la variable de port du fichier compose, ou réinstallez l'application pour que les ports correspondent.
check_port_drift_meaning: 'Le conteneur en cours publie un port différent de celui attendu par le launcher : boutons et liens ouvriraient la mauvaise adresse.'
check_readiness_blocker_fix: Suivez l'instruction du message - chaque blocage nomme sa propre réparation - puis vérifiez à nouveau.
check_readiness_blocker_meaning: Une condition préalable à l'installation ou au démarrage manque ; le message nomme le manque exact.
checking_context: Vérification du contexte Docker '{context}' ({endpoint})…
checking_docker: Vérification de Docker...
checking_health: Vérification de la disponibilité...
cleanup: Nettoyer
cleanup_done: 'Nettoyage terminé : {count} artefact(s) supprimé(s), {freed} libéré(s).'
cleanup_found: 'Résidus d''une installation précédente trouvés :'
cleanup_none: Aucun résidu d'installation trouvé.
cleanup_now: Nettoyer maintenant
cleanup_partial: Le nettoyage a partiellement échoué ({count} étape(s)).
cleanup_running: Nettoyage...
cleanup_scanning: Recherche de résidus d'installation...
cleanup_skipped: Nettoyage ignoré.
closed_minimized: L'application continue de fonctionner. Fenêtre réduite.
completed_before_cancel: 'Remarque : l''annulation est arrivée trop tard - l''opération était déjà terminée avec succès.'
compose_base_unresolved: Fichier compose introuvable à {path}. install_dir n'est pas défini, il a donc été recherché par rapport au répertoire courant, ce qui n'est pas fiable quand le launcher démarre depuis un raccourci, un Snap ou un gestionnaire de fichiers. Définissez install_dir dans la configuration du launcher sur le répertoire contenant le fichier compose.
compose_missing: 'Docker Compose n''est pas disponible. Installez le plugin Compose v2 — Ubuntu/Debian : ''sudo apt install docker-compose-plugin'' (ou mettez Docker à jour) — puis redémarrez le launcher. Les apps mono-service peuvent aussi utiliser deployment_mode ''dockerfile'' (sans Compose).'
compose_not_found: 'Fichier Compose introuvable : {path}'
compose_unreadable: 'Fichier compose trouvé mais illisible : {path} ({error}).'
compose_v1_incompatible: 'Seul l''ancien docker-compose v1 a été trouvé et il ne peut pas lire le fichier compose de cette app ({path}). Installez le plugin Compose v2 : ''sudo apt install docker-compose-plugin'', puis redémarrez le launcher.'
confirm_uninstall: 'Voulez-vous désinstaller {app} ?

  Vos données sont conservées.'
container_not_running: Le conteneur a été construit mais ne fonctionne pas.
container_started: Conteneur démarré ✓
copied_to_clipboard: Copié dans le presse-papiers.
copy_diagnosis: Copier le diagnostic
copy_support_bundle: Copier le paquet de support
data_preserved: Vos données ont été conservées.
disk_low: 'Peu d''espace disque pour le build : seulement {free} libres sur {path}, en dessous des {needed} qu''un build va probablement nécessiter. Libérez de l''espace, ou mettez min_build_disk_bytes à 0 pour ignorer cette vérification.'
docker_desktop_waiting: Docker Desktop démarre - cela peut prendre un moment (démarrage de la VM)…
docker_group_added: Groupe 'docker' ajouté. Déconnectez-vous puis reconnectez-vous (ou redémarrez) pour que le changement prenne effet ; Docker n'est pas encore utilisable dans cette session.
docker_group_cancelled: 'Annulé, rien n''a été modifié. Manuel : exécutez ''sudo usermod -aG docker $USER'', puis déconnectez-vous et reconnectez-vous.'
docker_group_confirm: Votre compte sera ajouté au groupe 'docker'. Cela donne en pratique les droits root sur ce système (pratique standard avec Docker). Continuer ?
docker_group_failed: 'Impossible d''ajouter au groupe ''docker'' : {error}. Manuel : exécutez ''sudo usermod -aG docker $USER'', puis déconnectez-vous et reconnectez-vous.'
docker_no_path: Docker Desktop est installé mais pas dans le PATH.
docker_no_permission: 'Docker fonctionne, mais votre utilisateur n''a pas la permission (absent du groupe ''docker''). Exécutez ''sudo usermod -aG docker $USER'' PUIS déconnectez-vous et reconnectez-vous (ou redémarrez) : le changement de groupe ne prend effet que dans une nouvelle session. Raccourci pour le terminal actuel uniquement : ''newgrp docker''.'
docker_no_response: Docker ne répond pas.
docker_not_installed: Docker n'est pas installé (docker absent du PATH).
docker_not_running: Docker est installé mais non démarré.
docker_not_running_detail: 'Docker n''est pas en cours d''exécution. Contexte vérifié ''{context}'' ({endpoint}) : {error}'
docker_ok: Docker fonctionne ✓
docker_permission_non_root_socket: Docker a refusé la connexion sur ce point de terminaison, qui n'est pas le socket root classique, donc le groupe 'docker' ne s'applique pas ici. Pour Docker rootless, définissez DOCKER_HOST sur $XDG_RUNTIME_DIR/docker.sock ; pour un point distant, vérifiez ses règles d'accès ; pour Docker Desktop, assurez-vous qu'il est lancé.
docker_running: Docker fonctionne.
docker_running_other_context: Docker fonctionne via le contexte '{context}' - le contexte actif était inaccessible, le lanceur s'est connecté automatiquement.
docker_stopped: Docker n'est pas démarré.
docker_unavailable: Docker n'est pas disponible (non démarré).
dockerfile_base_unresolved: Dockerfile introuvable à {path}. install_dir n'est pas défini, il a donc été recherché par rapport au répertoire courant, ce qui n'est pas fiable quand le launcher démarre depuis un raccourci, un Snap ou un gestionnaire de fichiers. Définissez install_dir dans la configuration du launcher sur le répertoire de build.
dockerfile_mode_needs_dockerpy: Le mode dockerfile nécessite le paquet Python docker (docker-py), qui n'est pas disponible dans cette installation.
dockerfile_not_found: 'Dockerfile introuvable : {path}. Vérifiez deployment_mode/Dockerfile dans la configuration du launcher.'
dockerfile_unreadable: 'Dockerfile trouvé mais illisible : {path} ({error}).'
error: 'Erreur : {msg}'
error_word: Erreur
fix_docker_permission: Configurer l'accès Docker…
free_port_found: 'Port libre trouvé : {port}.'
health_ok: Disponibilité confirmée ✓
hide_details: Masquer les détails
image_acquire_failed: 'Le téléchargement de l''image de l''app a échoué : {detail}'
image_acquiring: Téléchargement de l'image de l'app (peut prendre quelques minutes la première fois)...
image_archive_base_unresolved: Archive d'image introuvable à {path}. install_dir n'est pas défini, la recherche s'est donc faite relativement au répertoire courant, ce qui est peu fiable quand le launcher démarre depuis un raccourci de menu, un Snap ou un gestionnaire de fichiers. Définissez install_dir dans la configuration du launcher sur le répertoire contenant l'archive.
image_archive_unreadable: 'L''archive d''image configurée est illisible : {path} (recherchée dans {base})'
image_built: Image construite ✓
image_mode_needs_dockerpy: Le mode image nécessite le paquet Python docker (docker-py), indisponible dans cette installation.
image_mode_needs_reference: 'Le mode image nécessite une source d''image : définissez image_reference (tag ou digest) ou image_archive dans la configuration.'
image_needs_network: L'image de l'app n'est pas encore sur cette machine - son téléchargement nécessite une connexion internet. Ensuite, l'app fonctionne hors ligne.
install: Installer
install_needs_network: L'installation a besoin maintenant d'une connexion internet pour télécharger les images de base. L'app elle-même fonctionne hors ligne une fois installée.
installing: Configuration de {app}...
internal_port_changed: Port interne {name} changé en {port}.
internal_port_confirm: La modification d'un port interne nécessite de reconstruire les images Docker (2-5 minutes). Continuer ?
internal_port_field: 'Port {name} (interne) :'
internal_port_rebuilding: Port interne modifié. Reconstruction des images (cela peut prendre quelques minutes)...
internal_port_set: Port interne {name} défini sur {port}.
internal_port_unknown: 'Port interne inconnu : {name}.'
log_copied: Copié !
log_copy: Copier le journal
no_containers: Aucun conteneur trouvé ✓
no_docker: Docker n'est pas démarré.
no_free_port: Aucun port libre trouvé.
no_problems_found: 'Vérification réussie : aucun problème détecté.'
not_installed: '{app} n''est pas installé.'
not_reachable: 'Installé, mais {app} n''est pas accessible : {detail}'
not_reachable_after: '{app} non accessible après {timeout}s ({detail}).'
nothing_to_uninstall: Rien à désinstaller (aucun conteneur présent).
open_browser: Ouvrir dans le navigateur
open_install_guide: Ouvrir le guide d'installation
operation_cancelled: Annulé. Rien ne tourne maintenant ; les parties déjà téléchargées ou construites restent en cache et accélèrent la prochaine tentative. ({detail})
operation_pending_blocked: 'Impossible de démarrer ''{action}'' pour l''instant : l''étape précédente n''a pas confirmé sa fin et travaille peut-être encore sur l''application en arrière-plan. Pour éviter que deux opérations touchent le même conteneur, les nouvelles opérations attendent sa réponse, au plus {minutes} minutes. Redémarrer le launcher lève aussi ce blocage.'
port_changed: Port changé en {port}.
port_free: Le port {port} est libre.
port_invalid: Le port doit être compris entre {min} et {max}.
port_mismatch_rendered: Le launcher attend le port {expected}, mais le fichier compose publiera {published}. Vérifiez env_port_key ({port_key}) par rapport à la variable de port du compose et aux valeurs .env.
port_occupied: Le port {port} est occupé.
port_restarting: Port modifié. Redémarrage de {app}...
port_set: Port défini sur {port}.
problem_found: Problème détecté
ready: Installation terminée. {app} est prêt.
repo_url_not_cloned: 'Note : repo_url ({url}) ne sert qu''aux liens/vérifications de mise à jour - le launcher ne le clone pas. install_dir doit pointer vers un checkout local.'
restore_defaults: Restaurer les valeurs par défaut
retry: Vérifier à nouveau
