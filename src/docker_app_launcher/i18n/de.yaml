operation_pending_blocked: '''{action}'' kann noch nicht starten: der vorherige Schritt hat sein Ende nicht bestätigt und arbeitet möglicherweise im Hintergrund weiter an der App. Damit nicht zwei Vorgänge denselben Container anfassen, warten neue Vorgänge, bis er sich meldet, höchstens {minutes} Minuten. Ein Neustart des Launchers hebt das ebenfalls auf.'
pending_expired_unconfirmed: 'Hinweis: der vorherige Vorgang (''{action}'') hat sein Ende nie bestätigt - diese Freigabe beruht auf Zeitablauf, nicht auf Entwarnung. Sein Ergebnis ist unbekannt; führe die Systemprüfung aus, bevor du dich auf den aktuellen Zustand verlässt.'
