cancelling: Γίνεται ακύρωση...
check_compose_file_exists_fix: Βεβαιωθείτε ότι τα αρχεία της εφαρμογής βρίσκονται στο install_dir και ότι το όνομα του αρχείου compose ταιριάζει με το πραγματικό αρχείο.
check_compose_file_exists_meaning: Η εφαρμογή ελέγχεται από ένα αρχείο Docker Compose, και το ρυθμισμένο αρχείο δεν υπάρχει στη διαδρομή που εμφανίζεται.
check_docker_running_fix: 'Ξεκινήστε το Docker Desktop ή την υπηρεσία docker (Linux: ''sudo systemctl start docker'') και εκτελέστε ξανά τον έλεγχο. Αν το Docker δεν είναι εγκατεστημένο, εγκαταστήστε το πρώτα.'
check_docker_running_meaning: Το Docker είναι το περιβάλλον εκτέλεσης της εφαρμογής. Είναι εγκατεστημένο αλλά δεν εκτελείται, ή δεν είναι καθόλου εγκατεστημένο. Χωρίς Docker τίποτα δεν μπορεί να ξεκινήσει.
check_dockerfile_exists_fix: Κατευθύνετε το install_dir (και το build_context) στον πηγαίο κώδικα της εφαρμογής που περιέχει το Dockerfile.
check_dockerfile_exists_meaning: Αυτή η λειτουργία χτίζει την εφαρμογή από ένα Dockerfile, και δεν βρέθηκε κανένα στη διαδρομή που εμφανίζεται.
check_health_reachable_fix: Ανοίξτε τα αρχεία καταγραφής της εφαρμογής (κουμπί App logs) για να δείτε το σφάλμα της και μετά σταματήστε και ξεκινήστε ξανά την εφαρμογή.
check_health_reachable_meaning: Το container εκτελείται, αλλά η εφαρμογή μέσα του δεν απαντά στον έλεγχο υγείας - ίσως έχει καταρρεύσει.
check_image_source_declared_fix: Ορίστε image_reference (και προαιρετικά image_archive) στη ρύθμιση και ελέγξτε ξανά.
check_image_source_declared_meaning: Η λειτουργία image πρέπει να ξέρει ποια εικόνα θα εκτελεστεί - δεν έχει ρυθμιστεί ούτε αναφορά εικόνας ούτε χρησιμοποιήσιμο αρχείο.
check_install_dir_fix: Ορίστε το install_dir στη ρύθμιση του launcher στον φάκελο με τα αρχεία της εφαρμογής και ελέγξτε ξανά.
check_install_dir_meaning: Ο launcher δεν βρίσκει τον φάκελο προέλευσης της εφαρμογής (install_dir) που απαιτεί αυτή η λειτουργία.
check_port_drift_fix: Ευθυγραμμίστε το env_port_key και το αρχείο .env με τη μεταβλητή θύρας του αρχείου compose, ή επανεγκαταστήστε την εφαρμογή ώστε οι θύρες να ταιριάζουν.
check_port_drift_meaning: Το εκτελούμενο container δημοσιεύει διαφορετική θύρα από αυτήν που περιμένει ο launcher - κουμπιά και σύνδεσμοι θα άνοιγαν λάθος διεύθυνση.
check_readiness_blocker_fix: Ακολουθήστε την οδηγία του μηνύματος - κάθε εμπόδιο κατονομάζει τη δική του επισκευή - και ελέγξτε ξανά.
check_readiness_blocker_meaning: Λείπει μια προϋπόθεση για εγκατάσταση ή εκκίνηση· το μήνυμα κατονομάζει το ακριβές κενό.
