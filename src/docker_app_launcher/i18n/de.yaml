internal_port_compose_only: 'Interne Ports lassen sich nur im Compose-Bereitstellungsmodus ändern; diese App läuft im Modus {mode}. Dort gehört der interne Port zum Abbild selbst, ihn ändert also nur eine neue App-Version.'
